<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DietTracker Pro — Personal Fitness Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
    --primary: #10b981;
    --primary-dark: #059669;
    --primary-light: #d1fae5;
    --accent: #f59e0b;
    --danger: #ef4444;
    --bg-main: #0f172a;
    --card-bg: rgba(30, 41, 59, 0.7);
    --border-color: rgba(255, 255, 255, 0.08);
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Plus Jakarta Sans', sans-serif;
    -webkit-tap-highlight-color: transparent;
}

body {
    background: var(--bg-main);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
    padding-bottom: 60px;
}

/* Background Glowing Orbs Animation */
.bg-glow-1, .bg-glow-2 {
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    z-index: -1;
    opacity: 0.35;
    animation: float 12s infinite alternate ease-in-out;
}
.bg-glow-1 {
    width: 400px;
    height: 400px;
    background: #059669;
    top: -100px;
    left: -100px;
}
.bg-glow-2 {
    width: 350px;
    height: 350px;
    background: #3b82f6;
    bottom: 10%;
    right: -50px;
    animation-delay: -6s;
}

@keyframes float {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(50px, 40px) scale(1.15); }
}

header {
    background: rgba(15, 23, 42, 0.8);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border-color);
    padding: 30px 20px 60px;
    text-align: center;
    position: relative;
}

header h1 {
    font-size: 32px;
    font-weight: 800;
    background: linear-gradient(135deg, #34d399, #10b981, #60a5fa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.5px;
}

header p {
    color: var(--text-secondary);
    font-size: 14px;
    margin-top: 6px;
    font-weight: 500;
}

.container {
    max-width: 960px;
    margin: auto;
    padding: 0 20px;
}

/* Dashboard Cards */
.dashboard {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-top: -35px;
    position: relative;
    z-index: 10;
}

.stat-card {
    background: var(--card-bg);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border-color);
    padding: 20px 16px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.stat-card:hover {
    transform: translateY(-5px);
    border-color: rgba(16, 185, 129, 0.4);
    box-shadow: 0 25px 30px -5px rgba(16, 185, 129, 0.15);
}

.stat-card span {
    display: block;
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
}

.stat-card strong {
    font-size: 26px;
    font-weight: 800;
    color: var(--primary);
}

/* Base Card Style */
.card {
    background: var(--card-bg);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border-color);
    padding: 28px;
    margin-top: 24px;
    border-radius: 24px;
    box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    transition: border-color 0.3s ease;
}

.card:hover {
    border-color: rgba(255, 255, 255, 0.15);
}

.card h2 {
    font-size: 20px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
}

/* Inputs & Buttons */
.input-grid, .bmi-grid {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 12px;
}

input {
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid var(--border-color);
    padding: 14px 18px;
    border-radius: 14px;
    font-size: 15px;
    color: #fff;
    outline: none;
    transition: all 0.25s ease;
}

input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15);
    background: rgba(15, 23, 42, 0.9);
}

button {
    border: none;
    border-radius: 14px;
    padding: 14px 24px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4);
    filter: brightness(1.1);
}

button:active {
    transform: translateY(0);
}

.btn-danger {
    background: rgba(239, 68, 68, 0.15);
    color: #f87171;
    border: 1px solid rgba(239, 68, 68, 0.3);
    padding: 8px 14px;
    font-size: 13px;
    box-shadow: none;
}

.btn-danger:hover {
    background: rgba(239, 68, 68, 0.3);
    box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2);
}

/* Progress Bar */
.progress-bg {
    height: 18px;
    background: rgba(15, 23, 42, 0.8);
    border-radius: 30px;
    overflow: hidden;
    padding: 3px;
    border: 1px solid var(--border-color);
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #10b981, #34d399);
    border-radius: 30px;
    transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 0 12px rgba(16, 185, 129, 0.5);
}

.progress-info {
    margin-top: 12px;
    color: var(--text-secondary);
    font-size: 14px;
    font-weight: 500;
    display: flex;
    justify-content: space-between;
}

/* Meal Cards */
.extreme-badge {
    background: rgba(239, 68, 68, 0.2);
    color: #fca5a5;
    border: 1px solid rgba(239, 68, 68, 0.3);
    padding: 4px 12px;
    border-radius: 30px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    display: inline-block;
    margin-bottom: 12px;
}

.meal-plan-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-top: 16px;
}

.meal-card {
    background: rgba(15, 23, 42, 0.5);
    border: 1px solid var(--border-color);
    border-radius: 18px;
    padding: 18px;
    transition: all 0.3s ease;
}

.meal-card:hover {
    transform: translateY(-4px);
    border-color: rgba(16, 185, 129, 0.3);
    background: rgba(15, 23, 42, 0.7);
}

.meal-card h3 {
    color: var(--primary);
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
}

.meal-card p {
    font-size: 13.5px;
    color: var(--text-secondary);
    line-height: 1.5;
}

.meal-card .calorie-tag {
    font-size: 12px;
    color: #34d399;
    margin-top: 8px;
    font-weight: 600;
}

/* Tables */
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
}

th, td {
    padding: 14px;
    text-align: left;
    border-bottom: 1px solid var(--border-color);
    font-size: 14px;
}

th {
    color: var(--text-secondary);
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
}

td {
    color: var(--text-primary);
}

.budget-summary {
    background: rgba(16, 185, 129, 0.05);
    border: 1px dashed rgba(16, 185, 129, 0.3);
    padding: 20px;
    border-radius: 18px;
    margin-top: 20px;
}

.warning-box {
    background: rgba(239, 68, 68, 0.1);
    border-left: 4px solid var(--danger);
    padding: 16px;
    border-radius: 12px;
    margin-top: 20px;
    color: #fca5a5;
    font-size: 13px;
    line-height: 1.5;
}

/* Checkboxes */
.check-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px;
    border-radius: 14px;
    background: rgba(15, 23, 42, 0.4);
    border: 1px solid var(--border-color);
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.2s ease;
}

.check-item:hover {
    background: rgba(15, 23, 42, 0.8);
    border-color: rgba(255, 255, 255, 0.15);
}

.check-item input[type="checkbox"] {
    appearance: none;
    width: 20px;
    height: 20px;
    border: 2px solid var(--text-secondary);
    border-radius: 6px;
    outline: none;
    cursor: pointer;
    position: relative;
    transition: all 0.2s ease;
}

.check-item input[type="checkbox"]:checked {
    background: var(--primary);
    border-color: var(--primary);
}

.check-item input[type="checkbox"]:checked::after {
    content: '✓';
    position: absolute;
    color: white;
    font-size: 13px;
    font-weight: bold;
    top: -2px;
    left: 3px;
}

.check-item.completed {
    opacity: 0.5;
    text-decoration: line-through;
}

/* Chart Canvas */
.chart-container {
    position: relative;
    width: 100%;
    height: 320px;
    margin-top: 10px;
}

footer {
    text-align: center;
    margin-top: 50px;
    color: var(--text-secondary);
    font-size: 13px;
}

@media(max-width: 768px) {
    .dashboard {
        grid-template-columns: repeat(2, 1fr);
    }
    .input-grid, .bmi-grid, .meal-plan-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<div class="bg-glow-2"></div>

<header>

    <p>Target Perjalanan: 90 KG → 80 KG</p>
</header>

<div class="container">

<div class="dashboard">
